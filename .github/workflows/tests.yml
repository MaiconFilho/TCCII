name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes-scraping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipelines/scraping_anvisa/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipelines/scraping_anvisa/requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s pipelines/scraping_anvisa/tests -v

  testes-extracao-interacoes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/extracao_interacoes
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pipelines/scraping_anvisa/requirements.txt
            pipelines/extracao_interacoes/requirements.txt

      - name: Instalar dependências dos testes isolados
        run: >-
          python -m pip install
          PyMuPDF
          pydantic
          psutil
          "psycopg[binary]"
          python-dotenv

      - name: Executar testes sem modelo, GPU ou PostgreSQL real
        run: python -m unittest discover -s tests -v

  testes-conversao-interacoes-vetores:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/conversao_interacoes_vetores
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipelines/conversao_interacoes_vetores/requirements.txt

      - name: Instalar dependências dos testes isolados
        run: >-
          python -m pip install
          psutil
          "psycopg[binary]"
          python-dotenv

      - name: Executar testes sem modelo, GPU ou PostgreSQL real
        run: python -m unittest discover -s tests -v

  testes-identificacao-interacoes:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipelines/identificacao_interacoes/requirements.txt

      - name: Instalar dependências dos testes isolados
        run: >-
          python -m pip install
          PyMuPDF
          pydantic
          psutil
          "psycopg[binary]"
          python-dotenv

      - name: Executar testes sem modelo ou PostgreSQL real
        run: python -m unittest discover -s pipelines/identificacao_interacoes/tests -t . -v

      - name: Validar resumos com provedor simulado
        run: python -m unittest discover -s pipelines/resumos_interacoes/tests -t . -v

  testes-api-interacoes:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api_interacoes/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r apps/api_interacoes/requirements.txt

      - name: Executar testes sem PostgreSQL real
        run: python -m unittest discover -s apps/api_interacoes/tests -t . -v

  testes-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar build
        run: npm run build
