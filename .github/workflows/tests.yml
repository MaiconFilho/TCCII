name: Verificacoes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  banco-e-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste_isolado
          POSTGRES_DB: interamed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:teste_isolado@localhost:5432/interamed_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api_interacoes/requirements.txt
      - name: Instalar dependências de consulta
        run: python -m pip install -r apps/api_interacoes/requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q apps pipelines
      - name: Validar SQL completo e consultas da API em banco isolado
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg
          from fastapi.testclient import TestClient
          from psycopg.rows import dict_row
          from pipelines.identificacao_interacoes.aplicar_migracoes import aplicar, validar_esquema
          from apps.api_interacoes.app import criar_app
          from apps.api_interacoes.configuracao import ConfiguracaoApi

          dsn = os.environ['DATABASE_URL']
          assert aplicar(dsn, [])
          assert aplicar(dsn, []) == []
          with psycopg.connect(dsn, autocommit=True, row_factory=dict_row) as c:
              validar_esquema(c)
              c.execute("INSERT INTO bulas(nome_normalizado,nome_anvisa,status) VALUES ('meda','Meda','CONCLUIDO'),('medb','Medb','CONCLUIDO')")
              c.execute("INSERT INTO bulas_interacoes(nome_normalizado,trecho_interacoes,status_extracao) VALUES ('meda','Meda aumenta o efeito de Medb.','CONCLUIDO'),('medb','Nenhuma interação identificada.','CONCLUIDO')")
              pid = c.execute("INSERT INTO processamentos_interacoes(medicamento_origem,status,versao_processamento,modelo) VALUES ('meda','CONCLUIDO_COM_RELACOES','ci','simulado') RETURNING id").fetchone()['id']
              c.execute("INSERT INTO processamentos_interacoes(medicamento_origem,status,versao_processamento,modelo) VALUES ('medb','CONCLUIDO_SEM_RELACOES','ci','simulado')")
              iid = c.execute("INSERT INTO interacoes(medicamento_origem,processamento_id,alvo,tipo_alvo,resumo,evidencia) VALUES ('meda',%s,'Medb','MEDICAMENTO','Resumo persistido.','Meda aumenta o efeito de Medb.') RETURNING id", (pid,)).fetchone()['id']
              c.execute("INSERT INTO interacoes_medicamentos(interacao_id,medicamento_relacionado,criterio_vinculo) VALUES (%s,'medb','NOME_MEDICAMENTO_EXATO')", (iid,))
          with TestClient(criar_app(ConfiguracaoApi(dsn=dsn))) as h:
              assert h.get('/api/saude').json()['esquema'] == 'ok'
              assert h.get('/api/medicamentos/sugestoes', params={'q':'med'}).status_code == 200
              single = h.get('/api/interacoes', params={'medicamento':'meda'}).json()
              assert single['relacoes'][0]['id'] == iid
              assert single['relacoes'][0]['evidencia'] == 'Meda aumenta o efeito de Medb.'
              assert h.get('/api/interacoes', params={'medicamento':'medb'}).json()['interacao_identificada'] is False
              for a, b in [('meda','medb'),('medb','meda')]:
                  pair = h.get('/api/interacoes/par', params={'medicamento_a':a,'medicamento_b':b}).json()
                  assert pair['interacao_identificada'] is True and pair['evidencias']
              cors = h.options('/api/interacoes', headers={'Origin':'http://localhost:3000','Access-Control-Request-Method':'GET'})
              assert cors.headers['access-control-allow-origin'] == 'http://localhost:3000'
              assert h.post('/api/processamentos', json={'nome':'novo'}).status_code == 404
          assert not any(m.split('.')[0] in {'llama_cpp','torch','transformers','fitz','selenium'} for m in sys.modules)
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
